name: Publish BeeOS Python Package

on:
  workflow_dispatch:
  push:
    tags:
      - "beeos-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/beeos
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "beeos-v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Build package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-test wheel
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          "${GITHUB_WORKSPACE}/packages/beeos/.venv-smoke/bin/python" - <<'PY'
          import beeos

          assert tuple(map(int, beeos.sdk.__version__.split("."))) >= (0, 7, 0)
          client = beeos.BeeOS(api_key="oag_smoke_test")
          assert client.api_client.configuration.host == "https://openapi.beeos.ai"
          client.close()
          response = beeos.sdk.AgentListResponse.from_dict({
              "success": True,
              "data": [],
              "total": 0,
          })
          assert response.success is True
          print(beeos.__version__, beeos.sdk.__version__)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: beeos-python-distributions
          path: packages/beeos/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/beeos/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beeos-python-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
