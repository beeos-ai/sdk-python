name: Python SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -e packages/beeos pytest build twine
      - run: pytest -q
      - name: Verify minimum supported urllib3
        if: matrix.python-version == '3.9'
        run: |
          python -m pip install urllib3==2.1.0
          pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m build packages/beeos
      - run: python -m twine check packages/beeos/dist/*
      - name: Verify installed wheels, not editable sources
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl packages/beeos/dist/*.whl
          .wheel-smoke/bin/python -I -c 'from beeos import BeeOS, Task, TaskEvent, TaskExecutionError; c = BeeOS(api_key="package-test"); assert c.instance("phone").mobile; assert c.task("agent", "task").id == "task"; assert callable(c.files.download); c.close()'
